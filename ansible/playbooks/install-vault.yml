- name: Install Vault
  hosts: vault_servers
  become: true

  vars:
    vault_tls_certificate:
      certificate_path: /etc/vault/tls/tls.crt
      private_key_path: /etc/vault/tls/tls.key
      common_name: "{{ inventory_hostname }}"
      subject_alt_name:
        - "DNS:{{ inventory_hostname }}"
        - "IP:{{ ansible_facts['default_ipv4']['address'] }}"
      owner: vault
      group: vault

  roles:
    - role: vault

  tasks:
    - name: Fetch Vault TLS certificate for cert-manager
      ansible.builtin.fetch:
        src: "{{ vault_tls_certificate.certificate_path }}"
        dest: "{{ playbook_dir }}/../../terraform/kubernetes/files/vault-tls.crt"
        flat: true
