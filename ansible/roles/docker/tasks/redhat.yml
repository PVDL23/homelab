---
- name: Install DNF plugin support
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Install bash-completion package
  ansible.builtin.dnf:
    name: bash-completion
    state: present

- name: Remove conflicting packages
  ansible.builtin.dnf:
    name:
      - podman
      - runc
      - buildah
      - containers-common
    state: absent

- name: Configure Docker CE repository
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
    enabled: true
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/centos/gpg

- name: Install Docker CE packages
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Persist Docker networking sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-docker.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
  register: docker_sysctl_config

- name: Apply Docker networking sysctls
  ansible.builtin.command: sysctl --system
  changed_when: docker_sysctl_config.changed
  when: docker_sysctl_config.changed

- name: Ensure Docker configuration directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "firewall-backend": "nftables"
      }
  notify: restart docker
